[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicops-resilience"
version = "0.1.0"
description = "Malaysia disaster decision support research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
gis = ["osmnx>=2,<3"]

[project.scripts]
civicops = "disaster_response.cli:main"

[tool.setuptools.packages.find]
include = ["disaster_response*"]
