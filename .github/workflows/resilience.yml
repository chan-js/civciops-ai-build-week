name: Resilience model checks
on:
  pull_request:
    paths: ['disaster-response/**', '.github/workflows/resilience.yml']
  push:
    branches: ['codex/malaysia-disaster-model-v1']
    paths: ['disaster-response/**', '.github/workflows/resilience.yml']
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disaster-response
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node tests/parity.mjs
